<script>
  let scale = 1;
  let posX = 0, posY = 0;
  let isDragging = false;
  let startX, startY;

  const wrapper = document.getElementById('svg-wrapper');
  const container = document.getElementById('viewer-container');

  function updateTransform() {
    wrapper.style.transform = `translate(calc(-50% + ${posX}px), calc(-50% + ${posY}px)) scale(${scale})`;
  }

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = 1.1;
    if (e.deltaY < 0) {
      scale = Math.min(scale * zoomFactor, 5);
    } else {
      scale = Math.max(scale / zoomFactor, 0.4);
    }
    updateTransform();
  });

  container.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    updateTransform();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
  });

  function zoomIn() {
    scale = Math.min(scale * 1.2, 5);
    updateTransform();
  }
  function zoomOut() {
    scale = Math.max(scale / 1.2, 0.4);
    updateTransform();
  }
  function resetZoom() {
    scale = 1;
    posX = 0;
    posY = 0;
    updateTransform();
  }

  // 适应屏幕自适应初始化
  window.addEventListener('DOMContentLoaded', () => {
    const containerW = container.clientWidth;
    if (containerW < 1300) {
      scale = Math.max(containerW / 1350, 0.4);
      updateTransform();
    }
  });
</script>

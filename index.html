<script>
  let scale = 1;
  let posX = 0, posY = 0;
  let isDragging = false;
  let startX, startY;
  let isEditMode = true;
  let currentEditingTextElement = null;

  const wrapper = document.getElementById('svg-wrapper');
  const container = document.getElementById('viewer-container');
  const modal = document.getElementById('text-editor-modal');
  const input = document.getElementById('modal-text-input');

  function updateTransform() {
    wrapper.style.transform = `translate(calc(-50% + ${posX}px), calc(-50% + ${posY}px)) scale(${scale})`;
  }

  // 鼠标滚轮缩放
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = 1.1;
    if (e.deltaY < 0) {
      scale = Math.min(scale * zoomFactor, 6);
    } else {
      scale = Math.max(scale / zoomFactor, 0.3);
    }
    updateTransform();
  });

  // 画布拖拽平移
  container.addEventListener('mousedown', (e) => {
    if (e.target.tagName.toLowerCase() === 'text' && isEditMode) {
      return; // 点击文本交给双击事件
    }
    if (e.button === 0) {
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
      container.style.cursor = 'grabbing';
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    updateTransform();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    container.style.cursor = 'grab';
  });

  function zoomIn() { scale = Math.min(scale * 1.25, 6); updateTransform(); }
  function zoomOut() { scale = Math.max(scale / 1.25, 0.3); updateTransform(); }
  function resetZoom() { scale = 1; posX = 0; posY = 0; updateTransform(); }

  // 切换编辑/查看模式
  function toggleEditMode() {
    isEditMode = !isEditMode;
    const btn = document.getElementById('toggle-edit-btn');
    const badge = document.getElementById('mode-badge');
    const tip = document.getElementById('status-tip');
    if (isEditMode) {
      btn.classList.add('active');
      wrapper.classList.add('editing');
      badge.textContent = '编辑模式';
      badge.style.color = '#38bdf8';
      tip.textContent = '💡 当前为【编辑模式】：直接【双击图上任何文字】即可打字修改！修改完可一键导出！';
    } else {
      btn.classList.remove('active');
      wrapper.classList.remove('editing');
      badge.textContent = '查看模式';
      badge.style.color = '#94a3b8';
      tip.textContent = '💡 当前为【浏览模式】：按住鼠标左键可拖动平移，滚轮缩放查看细节。';
      closeTextModal();
    }
  }

  // 双击文字直接编辑
  document.getElementById('main-svg').addEventListener('dblclick', (e) => {
    if (!isEditMode) return;
    if (e.target.tagName.toLowerCase() === 'text') {
      currentEditingTextElement = e.target;
      input.value = currentEditingTextElement.textContent.trim();
      modal.style.display = 'block';
      modal.style.left = `${Math.min(e.clientX, window.innerWidth - 300)}px`;
      modal.style.top = `${Math.min(e.clientY - 20, window.innerHeight - 80)}px`;
      input.focus();
      input.select();
    }
  });

  function confirmTextEdit() {
    if (currentEditingTextElement) {
      currentEditingTextElement.textContent = input.value;
    }
    closeTextModal();
  }

  function closeTextModal() {
    modal.style.display = 'none';
    currentEditingTextElement = null;
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmTextEdit();
    if (e.key === 'Escape') closeTextModal();
  });

  // 添加自定义文字
  function addCustomText() {
    const textVal = prompt('请输入要添加的文字/备注说明：', '新增备注说明');
    if (!textVal) return;
    const svg = document.getElementById('main-svg');
    const newText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    newText.setAttribute('class', 'editable');
    newText.setAttribute('x', '640');
    newText.setAttribute('y', '380');
    newText.setAttribute('font-size', '14');
    newText.setAttribute('fill', '#dc2626');
    newText.setAttribute('font-weight', 'bold');
    newText.setAttribute('text-anchor', 'middle');
    newText.setAttribute('font-family', "'PingFang SC', sans-serif");
    newText.textContent = textVal;
    svg.appendChild(newText);
    alert('✅ 新文本已添加到画面正中央，可双击它修改内容！');
  }

  // 导出修改后的 SVG 矢量图
  function exportSVG() {
    const svgEl = document.getElementById('main-svg');
    const svgData = new XMLSerializer().serializeToString(svgEl);
    const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'AB门接线图_已编辑.svg';
    a.click();
    URL.revokeObjectURL(url);
  }

  // 导出修改后的 PNG 高清大图
  function exportPNG() {
    const svgEl = document.getElementById('main-svg');
    const svgData = new XMLSerializer().serializeToString(svgEl);
    const canvas = document.createElement('canvas');
    canvas.width = 2560; // 2x 超高清
    canvas.height = 1560;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    
    img.onload = () => {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const pngUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = pngUrl;
      a.download = 'AB门接线图_已编辑高清.png';
      a.click();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  // 自适应初始窗口大小
  window.addEventListener('DOMContentLoaded', () => {
    const containerW = container.clientWidth;
    if (containerW < 1300) {
      scale = Math.max(containerW / 1350, 0.4);
      updateTransform();
    }
  });
</script>
</body>
</html>
